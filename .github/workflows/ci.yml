name: JogjaTrip validation

on:
  push:
    branches: [main, cloudflare-deploy, 'feat/crs-vocabulary']
  pull_request:
    branches: [main, cloudflare-deploy]

permissions:
  contents: read

jobs:
  go:
    name: Go V5.3 source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go vet
        run: go vet ./...
      - name: Go unit tests
        run: go test -count=1 ./...

  cloudflare:
    name: Workers source checks (when present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect Workers package
        id: detect
        shell: bash
        run: |
          if [ -f cloudflare/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Worker source has not been committed; skip Node checks."
          fi
      - name: Install Worker dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Test Worker domain and mock API
        if: steps.detect.outputs.present == 'true'
        working-directory: cloudflare
        run: npm test
      - name: Check Worker entrypoint
        if: steps.detect.outputs.present == 'true'
        working-directory: cloudflare
        run: node --check src/index.js
      - name: Wrangler dry-run build (no Cloudflare deployment)
        if: steps.detect.outputs.present == 'true'
        working-directory: cloudflare
        run: |
          sed -i 's/REPLACE_WITH_REAL_D1_DATABASE_ID/00000000-0000-4000-8000-000000000000/' wrangler.jsonc
          npx wrangler deploy --dry-run --outdir /tmp/jogjatrip-worker-build
