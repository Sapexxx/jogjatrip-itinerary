name: Itinerary Jogja UI evidence
on:
  push:
    branches: [feat/itinerary-jogja-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrast baseline (known defects)
        run: python3 scripts/check-contrast.py --baseline || echo "Baseline defects recorded"
      - name: Check declared design token contrast when present
        run: |
          if [ -f cloudflare/web/tokens.css ]; then python3 scripts/check-contrast.py; fi
      - name: Capture four viewport sizes and five pages with local fixtures
        run: node cloudflare/tools/ui-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itinerary-jogja-ui-evidence
          path: ui-report/
          retention-days: 14
